# CI/CD do gateway: usa o pipeline reutilizável do repositório platform
# (build + testes, Trivy, imagem multi-arch no GHCR/ECR e deploy no EKS).
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  pipeline:
    uses: pna26/platform/.github/workflows/service.yaml@main
    with:
      service: gateway
      image: gateway-service
      aws-region: ${{ vars.AWS_REGION }}
      eks-cluster: ${{ vars.EKS_CLUSTER }}
      k8s-namespace: ${{ vars.K8S_NAMESPACE || 'store' }}
    secrets: inherit
