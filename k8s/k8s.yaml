# Gateway no EKS: só é acessível pelo balanceador (lb/Nginx), por isso ClusterIP.
# O CI troca a imagem ":latest" pela tag do commit antes do kubectl apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-configmap
data:
  AUTH_URI: http://auth:8080
  ACCOUNT_URI: http://account:8080
  EXCHANGE_URI: http://exchange:8080
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /gateway/actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/pna26/gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-configmap
          readinessProbe:
            httpGet:
              path: /gateway/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /gateway/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            # a JVM/Netty precisam de um /tmp gravável
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
